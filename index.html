<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HILL CLIMB · GYRO BIKE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* FULLSCREEN HARDCORE */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0f0a;
            touch-action: none;  /* kill scroll/pinch */
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, 'Segoe UI', 'Poppins', -apple-system, monospace;
        }

        /* GAME WRAPPER — fills whole screen */
        .game-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #6ab0d0 0%, #c5e0b4 100%);
            cursor: crosshair;
            touch-action: none;
        }

        /* MINIMAL OVERLAY: only speed + distance + fuel (tiny) */
        .stats-simple {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .stat-card {
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 60px;
            color: #FFE484;
            font-family: monospace;
            font-weight: bold;
        }

        /* BUTTONS — big, simple, edge-to-edge thumbs */
        .button-bar {
            position: absolute;
            bottom: 22px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 20px;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
        }

        .action-btn {
            pointer-events: auto;
            flex: 1;
            max-width: 160px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(18px);
            border: 2px solid rgba(255,200,100,0.8);
            border-radius: 80px;
            padding: 18px 0;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: white;
            font-family: monospace;
            letter-spacing: 2px;
            transition: 0.04s linear;
            touch-action: manipulation;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        .gas {
            background: rgba(230, 126, 34, 0.9);
            border-color: #ffcc77;
            text-shadow: 0 1px 2px black;
        }

        .brake {
            background: rgba(52, 152, 219, 0.9);
            border-color: #aaddff;
        }

        .reset-icon {
            position: absolute;
            bottom: 28px;
            right: 24px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            width: 60px;
            height: 60px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #FFB347;
            border: 1px solid #ffbb66;
            pointer-events: auto;
            cursor: pointer;
            z-index: 25;
            transition: 0.05s linear;
            touch-action: manipulation;
        }

        .reset-icon:active {
            transform: scale(0.94);
            background: rgba(0,0,0,0.9);
        }

        .gyro-tag {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 0.7rem;
            color: #dddd99;
            font-weight: bold;
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
        }

        /* crash overlay minimalist */
        .crash-toast {
            position: absolute;
            top: 40%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 2.6rem;
            font-weight: 800;
            color: #FFB347;
            text-shadow: 0 3px 0 #5a2e00;
            background: none;
            pointer-events: none;
            z-index: 30;
            font-family: monospace;
            letter-spacing: 4px;
        }

        @media (max-width: 700px) {
            .action-btn { padding: 14px 0; font-size: 1.8rem; max-width: 140px; }
            .stat-card { font-size: 1rem; padding: 4px 12px; }
            .reset-icon { width: 52px; height: 52px; font-size: 1.8rem; bottom: 22px; right: 18px; }
            .gyro-tag { font-size: 0.6rem; top: 12px; right: 12px; }
        }
    </style>
</head>
<body>
<div class="game-full">
    <canvas id="gameCanvas"></canvas>
    
    <!-- MINIMAL GUI: only stats + gas/brake + tiny reset -->
    <div class="stats-simple">
        <div class="stat-card">🏁 <span id="distValue">0</span>m</div>
        <div class="stat-card">⚡ <span id="speedValue">0</span>km/h</div>
        <div class="stat-card">⛽ <span id="fuelValue">100</span>%</div>
    </div>
    <div class="gyro-tag" id="gyroStatusText">📳 TILT TO STEER</div>
    
    <div class="button-bar">
        <div class="action-btn gas" id="gasButton">⛽ GAS</div>
        <div class="action-btn brake" id="brakeButton">🛑 BRAKE</div>
    </div>
    <div class="reset-icon" id="resetButton">↺</div>
    <div id="crashMessage" class="crash-toast" style="display: none;">💥 CRASH</div>
</div>

<script>
    (function(){
        // ------------------- SUPER SIMPLE BUT FULL PHYSICS -------------------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // ---------- WORLD & TERRAIN (endless feeling with hills) ----------
        const TERRAIN_STEP = 14;
        const WORLD_WIDTH = 5800;
        let terrainPoints = [];
        let cameraX = 0;
        
        // bike physics (simplified but feels like hill climb)
        let bike = {
            x: 380,
            y: 0,
            vx: 2.4,
            vy: 0,
            angle: 0,
            angVel: 0,
            fuel: 100,
            crashed: false,
            distance: 0,
            bestDist: 0
        };
        
        // constants
        const GRAVITY = 0.52;
        const ENGINE_FORCE = 0.58;
        const BRAKE_POWER = 0.82;
        const WHEEL_BASE = 28;
        
        let gasActive = false;
        let brakeActive = false;
        
        // gyro steering
        let gyroGamma = 0;
        let gyroLive = false;
        let leanInfluence = 0;
        
        // ---------- FUNCTIONS: TERRAIN generation (hill climb style steep sections) ----------
        function generateTerrain() {
            let points = [];
            let baseY = height - 110;
            for (let i = 0; i <= WORLD_WIDTH; i += TERRAIN_STEP) {
                let xVal = i;
                // rolling hills + steep walls
                let wave1 = Math.sin(xVal * 0.006) * 26;
                let wave2 = Math.cos(xVal * 0.014) * 18;
                let wave3 = Math.sin(xVal * 0.025) * 12;
                let hill = wave1 + wave2 + wave3;
                // climb zone (nasty hillclimb)
                if (xVal > 1400 && xVal < 2400) hill += Math.sin((xVal-1400)*0.017) * 28;
                if (xVal > 3100 && xVal < 3900) hill -= Math.cos((xVal-3100)*0.012) * 32;
                if (xVal > 4600) hill += Math.sin(xVal*0.009) * 24;
                
                let yPos = baseY - hill;
                yPos = Math.min(height - 55, Math.max(height - 155, yPos));
                points.push({ x: i, y: yPos });
            }
            // smoothing pass (mild)
            for (let p = 0; p < 2; p++) {
                for (let i = 1; i < points.length-1; i++) {
                    points[i].y = (points[i-1].y + points[i].y + points[i+1].y) / 3;
                }
            }
            return points;
        }
        
        function getGroundY(worldX) {
            if (worldX <= 0) return terrainPoints[0].y;
            if (worldX >= WORLD_WIDTH) return terrainPoints[terrainPoints.length-1].y;
            let idx = Math.floor(worldX / TERRAIN_STEP);
            idx = Math.min(idx, terrainPoints.length-2);
            let t = (worldX - terrainPoints[idx].x) / TERRAIN_STEP;
            return terrainPoints[idx].y + (terrainPoints[idx+1].y - terrainPoints[idx].y) * t;
        }
        
        function getGroundSlope(worldX) {
            let leftY = getGroundY(worldX - 6);
            let rightY = getGroundY(worldX + 6);
            return Math.atan2(rightY - leftY, 12);
        }
        
        // ---------- PHYSICS (responsive + rollover crash) ----------
        function updateGame(dt) {
            if (bike.crashed) return;
            dt = Math.min(dt, 0.033);
            
            // throttle & fuel
            let acceleration = 0;
            if (gasActive && bike.fuel > 0) {
                acceleration = ENGINE_FORCE;
                bike.fuel -= 0.28 * dt * 8;
                if (bike.fuel < 0) bike.fuel = 0;
            }
            if (brakeActive) acceleration = -BRAKE_POWER;
            
            let slope = getGroundSlope(bike.x);
            let gravityPush = Math.sin(slope) * GRAVITY * 0.68;
            bike.vx += (acceleration - gravityPush) * dt;
            // friction
            let tireFriction = 0.985;
            if (Math.abs(bike.vx) < 0.8) tireFriction = 0.99;
            bike.vx *= (1 - (1-tireFriction) * dt * 2.5);
            // speed limits
            bike.vx = Math.min(48, Math.max(-13, bike.vx));
            
            // move bike
            let newX = bike.x + bike.vx * dt * 2.3;
            if (newX > 55 && newX < WORLD_WIDTH - 55) bike.x = newX;
            else {
                if (newX <= 55) { bike.x = 55; if(bike.vx < 0) bike.vx = 0; }
                if (newX >= WORLD_WIDTH-55) { bike.x = WORLD_WIDTH-55; if(bike.vx > 0) bike.vx = 0; }
            }
            
            // suspension & wheel contact
            let rearX = bike.x - WHEEL_BASE/2;
            let frontX = bike.x + WHEEL_BASE/2;
            let rearGround = getGroundY(rearX);
            let frontGround = getGroundY(frontX);
            let wantedBodyY = (rearGround + frontGround) / 2 - 11;
            bike.y = bike.y * 0.82 + wantedBodyY * 0.18;
            
            // angle from ground + gyro steering torque
            let terrainAngle = Math.atan2(frontGround - rearGround, WHEEL_BASE);
            if (gyroLive) {
                // map gamma (-45...45) to -1..1 lean
                let leanRaw = Math.min(0.95, Math.max(-0.95, gyroGamma / 48));
                leanInfluence = leanRaw;
                let torque = leanInfluence * 3.6 * (Math.abs(bike.vx) * 0.1 + 0.65);
                bike.angVel += torque * dt * 4.2;
            }
            bike.angVel *= 0.93;
            bike.angVel += (terrainAngle - bike.angle) * 2.2 * dt;
            bike.angle += bike.angVel * dt * 3.4;
            bike.angle = Math.min(0.85, Math.max(-0.85, bike.angle));
            
            // crash if bike flips too much
            if (Math.abs(bike.angle) > 0.92 || bike.y < rearGround - 34 || bike.y < frontGround - 34) {
                bike.crashed = true;
                document.getElementById('crashMessage').style.display = 'block';
                setTimeout(() => {
                    if(bike.crashed) document.getElementById('crashMessage').style.display = 'none';
                }, 900);
            }
            if (bike.fuel <= 0.02) bike.crashed = true;
            
            // distance & UI update
            let meters = Math.floor(bike.x / 5.3);
            bike.distance = meters;
            if (meters > bike.bestDist) bike.bestDist = meters;
            document.getElementById('distValue').innerText = bike.distance;
            let spdKmh = Math.floor(Math.abs(bike.vx * 2.35));
            document.getElementById('speedValue').innerText = spdKmh;
            let fuelPercent = Math.max(0, Math.floor(bike.fuel));
            document.getElementById('fuelValue').innerHTML = fuelPercent;
            
            // camera follow (smooth)
            let targetCam = bike.x - width/2 + 40;
            targetCam = Math.min(WORLD_WIDTH - width + 30, Math.max(-20, targetCam));
            cameraX = cameraX * 0.92 + targetCam * 0.08;
        }
        
        // ---------- DRAW: minimalistic but juicy ----------
        function drawTerrain() {
            let startIdx = Math.max(0, Math.floor(cameraX / TERRAIN_STEP));
            let endIdx = Math.min(terrainPoints.length-1, Math.floor((cameraX+width)/TERRAIN_STEP) + 3);
            ctx.fillStyle = '#5b3c1a';
            ctx.beginPath();
            let first = terrainPoints[startIdx];
            ctx.moveTo(first.x - cameraX, first.y);
            for (let i=startIdx+1; i<=endIdx; i++) {
                let p = terrainPoints[i];
                ctx.lineTo(p.x - cameraX, p.y);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
            // grass strokes
            ctx.fillStyle = '#548235';
            for (let i=startIdx; i<=endIdx; i+=3) {
                let p = terrainPoints[i];
                let sx = p.x - cameraX;
                ctx.fillRect(sx-3, p.y-6, 5, 9);
            }
            // simple shadow under bike zone
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = '#1f2c0a';
            for (let i=startIdx; i<=endIdx; i+=2) {
                let p = terrainPoints[i];
                ctx.fillRect(p.x-cameraX-2, p.y-2, 5, 5);
            }
            ctx.globalAlpha = 1;
        }
        
        function drawBike() {
            let screenX = bike.x - cameraX;
            let bodyY = bike.y;
            ctx.save();
            ctx.translate(screenX, bodyY);
            ctx.rotate(bike.angle);
            // wheels (big & mean)
            ctx.fillStyle = '#1f1d1d';
            ctx.beginPath();
            ctx.ellipse(-13, 7, 10, 14, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(13, 7, 10, 14, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#999';
            ctx.beginPath();
            ctx.arc(-13, 7, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(13, 7, 6, 0, Math.PI*2);
            ctx.fill();
            // frame & tank
            ctx.beginPath();
            ctx.moveTo(-12, -1);
            ctx.lineTo(0, -15);
            ctx.lineTo(12, -1);
            ctx.lineTo(6, 8);
            ctx.lineTo(-6, 8);
            ctx.fillStyle = '#e65c1e';
            ctx.fill();
            ctx.fillStyle = '#c2450a';
            ctx.fillRect(-5, -18, 10, 13);
            // rider (minimal but expressive)
            ctx.fillStyle = '#26802e';
            ctx.beginPath();
            ctx.ellipse(0, -22, 7, 11, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fbcb8e';
            ctx.beginPath();
            ctx.arc(0, -28, 5.5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillRect(-2, -30, 2.2, 3);
            ctx.fillRect(1.2, -30, 2.2, 3);
            ctx.fillStyle = '#dd5522';
            ctx.beginPath();
            ctx.ellipse(0, -33, 6.5, 5, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            
            // gyro lean arrow
            if (gyroLive && Math.abs(leanInfluence) > 0.08) {
                ctx.font = "bold 21px monospace";
                ctx.fillStyle = "#FFFAC2";
                ctx.shadowBlur = 0;
                ctx.fillText(leanInfluence > 0 ? "↷" : "↶", screenX-28, bodyY-32);
            }
        }
        
        function drawSkyAndStatic() {
            let grad = ctx.createLinearGradient(0, 0, 0, height*0.6);
            grad.addColorStop(0, "#7bc5e6");
            grad.addColorStop(1, "#cdeda5");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            // clouds
            ctx.fillStyle = "#ffffffee";
            for (let i = 0; i < 3; i++) {
                let cloudX = (cameraX * 0.15 + i * 240) % (width + 280) - 110;
                ctx.beginPath();
                ctx.ellipse(cloudX, 48, 38, 32, 0, 0, Math.PI*2);
                ctx.ellipse(cloudX+33, 42, 33, 28, 0, 0, Math.PI*2);
                ctx.ellipse(cloudX-26, 44, 32, 27, 0, 0, Math.PI*2);
                ctx.fill();
            }
        }
        
        function drawCrashGlow() {
            if (bike.crashed) {
                ctx.fillStyle = "#ff000022";
                ctx.fillRect(0,0,width,height);
                ctx.font = "bold 44px monospace";
                ctx.fillStyle = "#ffae42";
                ctx.shadowBlur = 8;
                ctx.fillText("💥", width/2-38, height/2-60);
            }
        }
        
        function renderFull() {
            drawSkyAndStatic();
            drawTerrain();
            drawBike();
            drawCrashGlow();
            // tiny fuel indicator overlay bar
            let fuelWidth = (bike.fuel / 100) * 70;
            ctx.fillStyle = "#2c2b1fcc";
            ctx.fillRect(18, height-32, 76, 12);
            ctx.fillStyle = "#f5a342";
            ctx.fillRect(19, height-31, fuelWidth, 10);
        }
        
        // ---------- RESET FUNCTION ----------
        function resetGame() {
            terrainPoints = generateTerrain();
            bike = {
                x: 380,
                y: getGroundY(380)-13,
                vx: 2.1,
                vy: 0,
                angle: 0,
                angVel: 0,
                fuel: 100,
                crashed: false,
                distance: 0,
                bestDist: 0
            };
            gasActive = false;
            brakeActive = false;
            cameraX = 0;
            leanInfluence = 0;
            document.getElementById('crashMessage').style.display = 'none';
            document.getElementById('fuelValue').innerHTML = "100";
            document.getElementById('distValue').innerText = "0";
        }
        
        // ---------- GYRO (simple & permission) ----------
        let gyroPermissionRequested = false;
        function enableGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(perm => {
                        if (perm === 'granted') {
                            window.addEventListener('deviceorientation', (e) => { if(e.gamma !== undefined) gyroGamma = e.gamma; });
                            gyroLive = true;
                            document.getElementById('gyroStatusText').innerHTML = "🎮 GYRO ACTIVE";
                        }
                    }).catch(()=>{ gyroLive = false; });
            } else {
                window.addEventListener('deviceorientation', (e) => { if(e.gamma) gyroGamma = e.gamma; });
                gyroLive = true;
                document.getElementById('gyroStatusText').innerHTML = "📳 TILT STEER";
            }
        }
        
        function requestGyroOnTouch() {
            if (!gyroPermissionRequested) {
                gyroPermissionRequested = true;
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    enableGyro();
                } else {
                    gyroLive = true;
                    window.addEventListener('deviceorientation', (e) => { if(e.gamma) gyroGamma = e.gamma; });
                    document.getElementById('gyroStatusText').innerHTML = "📳 GYRO ON";
                }
            }
        }
        
        // BUTTON HANDLERS (simple)
        const gasBtn = document.getElementById('gasButton');
        const brakeBtn = document.getElementById('brakeButton');
        const resetBtn = document.getElementById('resetButton');
        
        function setGas(state) { gasActive = state; }
        function setBrake(state) { brakeActive = state; }
        
        gasBtn.addEventListener('mousedown', (e) => { e.preventDefault(); setGas(true); });
        gasBtn.addEventListener('mouseup', () => setGas(false));
        gasBtn.addEventListener('mouseleave', () => setGas(false));
        gasBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setGas(true); });
        gasBtn.addEventListener('touchend', () => setGas(false));
        
        brakeBtn.addEventListener('mousedown', (e) => { e.preventDefault(); setBrake(true); });
        brakeBtn.addEventListener('mouseup', () => setBrake(false));
        brakeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setBrake(true); });
        brakeBtn.addEventListener('touchend', () => setBrake(false));
        
        resetBtn.addEventListener('click', () => resetGame());
        resetBtn.addEventListener('touchstart', (e) => { e.preventDefault(); resetGame(); });
        
        // tap anywhere on canvas to request gyro (iOS)
        canvas.addEventListener('touchstart', () => requestGyroOnTouch());
        canvas.addEventListener('click', () => requestGyroOnTouch());
        
        // GAME LOOP
        terrainPoints = generateTerrain();
        bike.y = getGroundY(bike.x)-12;
        let lastFrame = performance.now();
        
        function animate(now) {
            let dt = Math.min(0.033, (now - lastFrame) / 1000);
            if (dt > 0.008) updateGame(dt);
            renderFull();
            lastFrame = now;
            requestAnimationFrame(animate);
        }
        
        // manually add fallback for orientation
        window.addEventListener('resize', () => {
            resizeCanvas();
            cameraX = Math.min(WORLD_WIDTH - width + 30, Math.max(-20, cameraX));
        });
        
        lastFrame = performance.now();
        animate(lastFrame);
        
        // initial gyro hint
        setTimeout(() => {
            if (!gyroLive && !gyroPermissionRequested) {
                document.getElementById('gyroStatusText').innerHTML = "📱 TAP TO ENABLE GYRO";
            }
        }, 200);
    })();
</script>
</body>
</html>
