<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HILL CLIMB RACER — Gyro Moto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a1a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, 'Segoe UI', 'Poppins', sans-serif;
            touch-action: pan-x pan-y; /* allow scroll but not zoom */
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            background: #1e2a1a;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: linear-gradient(180deg, #72b0d0 0%, #b8dcf0 30%, #d9b06a 100%);
            cursor: pointer;
            touch-action: none;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #0f1a0c;
            padding: 10px 16px;
            color: #ffd966;
            font-weight: bold;
            font-size: 0.9rem;
            border-bottom: 2px solid #ffa500;
        }

        .stat {
            background: #2a2e1e;
            padding: 4px 12px;
            border-radius: 50px;
            display: flex;
            gap: 6px;
            align-items: baseline;
        }

        .controls {
            background: #1f2a18;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .gyro-card {
            background: #000000aa;
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffdd99;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .action-buttons {
            display: flex;
            gap: 18px;
        }

        .ctrl-btn {
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            width: 85px;
            padding: 12px 0;
            border-radius: 60px;
            color: white;
            text-shadow: 0 1px 2px black;
            box-shadow: 0 5px 0 #222;
            transition: 0.04s linear;
            cursor: pointer;
            touch-action: manipulation;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #222;
        }

        .gas {
            background: #e67e22;
            box-shadow: 0 5px 0 #b45f1b;
        }

        .brake {
            background: #3498db;
            box-shadow: 0 5px 0 #1f618d;
        }

        .reset-btn {
            background: #555;
            box-shadow: 0 5px 0 #333;
            width: 65px;
            font-size: 1.4rem;
        }

        .warning {
            background: #e67e22dd;
            color: #1a1a1a;
            text-align: center;
            font-size: 0.7rem;
            padding: 4px;
            font-weight: bold;
        }

        @media (max-width: 550px) {
            .ctrl-btn { width: 70px; font-size: 1.5rem; }
            .stat { font-size: 0.7rem; padding: 2px 8px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="stats-bar">
        <div class="stat">🏍️ <span id="scoreVal">0</span>m</div>
        <div class="stat">⛽ FUEL <span id="fuelVal">100</span>%</div>
        <div class="stat">⚡ <span id="speedVal">0</span> km/h</div>
    </div>
    <canvas id="gameCanvas" width="550" height="420" style="width:100%; height:auto; aspect-ratio:550/420"></canvas>
    <div class="controls">
        <div class="gyro-card">
            <span>📳</span>
            <span id="gyroLabel">Tilt to Steer</span>
        </div>
        <div class="action-buttons">
            <button class="ctrl-btn gas" id="gasBtn">⛽ GAS</button>
            <button class="ctrl-btn brake" id="brakeBtn">🛑 BRAKE</button>
            <button class="ctrl-btn reset-btn" id="resetBtn">🔄</button>
        </div>
    </div>
    <div id="gyroMsg" class="warning">🎮 Tilt phone left/right → lean & steer | Gas & Brake</div>
</div>

<script>
    (function(){
        // ----- CANVAS ------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 550;
        canvas.height = 420;
        const W = 550, H = 420;

        // ----- WORLD & TERRAIN -----
        let terrain = [];       // array of {x, y}
        const STEP = 12;
        const WORLD_WIDTH = 4500;
        let cameraX = 0;
        
        // ----- BIKE PHYSICS (realistic 2-wheel) ----
        let bike = {
            x: 280,             // world X (rear axle approx)
            y: 0,
            vx: 2.5,
            vy: 0,
            angle: 0,          // body tilt rad
            angVel: 0,
            rearY: 0, frontY: 0,
            fuel: 100,
            crashed: false,
            distance: 0,
            maxDistance: 0
        };
        
        // constants
        const GRAVITY = 0.55;
        const ENGINE_FORCE = 0.52;
        const BRAKE_FORCE = 0.75;
        const WHEELBASE = 26;    // pixels between wheels
        const REAR_SUSP = 0.3;    // spring
        let gasOn = false;
        let brakeOn = false;
        
        // gyro steering
        let gyroGamma = 0;
        let gyroEnabled = false;
        let leanTarget = 0;
        
        // fuel consumption
        let lastFuelTime = 0;
        
        // ---------- TERRAIN GENERATION (Hill Climb style steep hills) ----------
        function generateTerrain() {
            let points = [];
            let baseY = H - 75;
            let x = 0;
            let y = baseY;
            // random walk + sine hills
            for (let i = 0; i <= WORLD_WIDTH; i += STEP) {
                let freq1 = Math.sin(i * 0.0065) * 22;
                let freq2 = Math.cos(i * 0.012) * 18;
                let freq3 = Math.sin(i * 0.023) * 12;
                let hill = freq1 + freq2 + freq3;
                // steep climb zone (1200 - 2000)
                if (i > 1100 && i < 2100) hill += Math.sin((i-1100)*0.018) * 24;
                // big downhill after
                if (i > 2400 && i < 3000) hill -= Math.cos((i-2400)*0.014) * 28;
                // final hills
                if (i > 3500) hill += Math.sin(i*0.011) * 20;
                
                let newY = baseY - hill;
                newY = Math.min(H - 48, Math.max(H - 142, newY));
                points.push({ x: i, y: newY });
            }
            // smoothing (simple)
            for (let pass = 0; pass < 2; pass++) {
                for (let i = 1; i < points.length-1; i++) {
                    points[i].y = (points[i-1].y + points[i].y + points[i+1].y) / 3;
                }
            }
            return points;
        }
        
        function getGroundY(worldX) {
            if (worldX <= 0) return terrain[0].y;
            if (worldX >= WORLD_WIDTH) return terrain[terrain.length-1].y;
            let idx = Math.floor(worldX / STEP);
            idx = Math.min(idx, terrain.length-2);
            let t = (worldX - terrain[idx].x) / STEP;
            return terrain[idx].y + (terrain[idx+1].y - terrain[idx].y) * t;
        }
        
        function getGroundSlope(worldX) {
            let h1 = getGroundY(worldX - 5);
            let h2 = getGroundY(worldX + 5);
            return Math.atan2(h2 - h1, 10);
        }
        
        // ----- UPDATE PHYSICS (suspension + rollover) -----
        function updatePhysics(dt) {
            if (bike.crashed) return;
            dt = Math.min(dt, 0.033);
            
            // gas / brake with fuel consumption
            let acc = 0;
            if (gasOn && bike.fuel > 0) {
                acc = ENGINE_FORCE;
                bike.fuel -= 0.25 * dt * 12;
                if (bike.fuel < 0) bike.fuel = 0;
            }
            if (brakeOn) acc = -BRAKE_FORCE;
            
            let slope = getGroundSlope(bike.x);
            let gravityPull = Math.sin(slope) * GRAVITY * 0.7;
            bike.vx += (acc * 1.1 - gravityPull) * dt;
            // drag & friction
            let friction = 0.99;
            if (Math.abs(bike.vx) > 0.3) friction = 0.985;
            bike.vx *= (1 - (1-friction) * dt * 3);
            let maxForward = 42;
            let maxBack = -14;
            bike.vx = Math.min(maxForward, Math.max(maxBack, bike.vx));
            
            // move bike
            let newX = bike.x + bike.vx * dt * 2.2;
            if (newX > 40 && newX < WORLD_WIDTH - 40) bike.x = newX;
            else if (newX <= 40) { bike.x = 40; if(bike.vx<0) bike.vx=0; }
            else if (newX >= WORLD_WIDTH-40) { bike.x = WORLD_WIDTH-40; if(bike.vx>0) bike.vx=0; }
            
            // calculate wheel ground heights (suspension)
            let rearX = bike.x - WHEELBASE/2;
            let frontX = bike.x + WHEELBASE/2;
            let rearGround = getGroundY(rearX);
            let frontGround = getGroundY(frontX);
            bike.rearY = rearGround - 6;
            bike.frontY = frontGround - 6;
            let targetBodyY = (bike.rearY + bike.frontY) / 2 - 9;
            bike.y = bike.y * 0.85 + targetBodyY * 0.15;
            
            // bike angle from suspension
            let targetAngle = Math.atan2(bike.frontY - bike.rearY, WHEELBASE);
            // gyro lean input = torque
            if (gyroEnabled) {
                leanTarget = Math.min(0.9, Math.max(-0.9, gyroGamma / 55));
                let torque = leanTarget * 3.2 * (Math.abs(bike.vx) * 0.12 + 0.6);
                bike.angVel += torque * dt * 3.8;
            }
            bike.angVel *= 0.92;
            bike.angVel += (targetAngle - bike.angle) * 1.8 * dt;
            bike.angle += bike.angVel * dt * 3.2;
            bike.angle = Math.min(0.85, Math.max(-0.85, bike.angle));
            
            // CRASH if bike tilts too much (> 45 deg)
            if (Math.abs(bike.angle) > 0.9 || bike.y < rearGround - 32 || bike.y < frontGround - 32) {
                bike.crashed = true;
            }
            
            // distance tracking and fuel auto decrease on high rpm
            let distMeters = Math.floor(bike.x / 5.8);
            bike.distance = distMeters;
            if (distMeters > bike.maxDistance) bike.maxDistance = distMeters;
            document.getElementById('scoreVal').innerText = bike.distance;
            let fuelPercent = Math.max(0, Math.floor(bike.fuel));
            document.getElementById('fuelVal').innerHTML = fuelPercent;
            let speedKmh = Math.abs(bike.vx * 2.1).toFixed(0);
            document.getElementById('speedVal').innerHTML = speedKmh;
            
            // fuel game over
            if (bike.fuel <= 0.1) bike.crashed = true;
            
            // camera follow
            let targetCam = bike.x - W/2 + 35;
            targetCam = Math.min(WORLD_WIDTH - W + 20, Math.max(-20, targetCam));
            cameraX = cameraX * 0.92 + targetCam * 0.08;
        }
        
        // ---------- DRAW EVERYTHING ----------
        function drawTerrain() {
            let startIdx = Math.max(0, Math.floor(cameraX / STEP));
            let endIdx = Math.min(terrain.length-1, Math.floor((cameraX+W)/STEP)+2);
            ctx.fillStyle = '#5c3e1f';
            ctx.beginPath();
            let first = terrain[startIdx];
            ctx.moveTo(first.x - cameraX, first.y);
            for (let i=startIdx+1; i<=endIdx; i++) {
                let p = terrain[i];
                ctx.lineTo(p.x - cameraX, p.y);
            }
            ctx.lineTo(W, H);
            ctx.lineTo(0, H);
            ctx.fill();
            // grass
            for (let i=startIdx; i<=endIdx; i+=2) {
                let p = terrain[i];
                let sx = p.x - cameraX;
                ctx.fillStyle = '#467a2e';
                ctx.fillRect(sx-3, p.y-7, 6, 9);
            }
            // skidmarks
            ctx.strokeStyle = '#3a2819';
            ctx.lineWidth = 2;
            for (let i=0;i<50;i++) {
                let markX = cameraX + (i*23) % W;
                let worldM = cameraX + markX;
                let yGround = getGroundY(worldM);
                if (yGround && markX>0 && markX<W) {
                    ctx.beginPath();
                    ctx.moveTo(markX, yGround-2);
                    ctx.lineTo(markX+4, yGround-5);
                    ctx.stroke();
                }
            }
        }
        
        function drawBike() {
            let screenX = bike.x - cameraX;
            let bodyY = bike.y;
            ctx.save();
            ctx.translate(screenX, bodyY);
            ctx.rotate(bike.angle);
            // wheels
            ctx.fillStyle = '#2c2c2c';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.ellipse(-13, 6, 9, 12, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(13, 6, 9, 12, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(-13, 6, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(13, 6, 5, 0, Math.PI*2);
            ctx.fill();
            // frame
            ctx.beginPath();
            ctx.moveTo(-11, -1);
            ctx.lineTo(0, -14);
            ctx.lineTo(11, -1);
            ctx.lineTo(5, 7);
            ctx.lineTo(-5, 7);
            ctx.fillStyle = '#dd5c1e';
            ctx.fill();
            ctx.fillStyle = '#b33e0a';
            ctx.fillRect(-4, -16, 8, 12);
            // rider
            ctx.fillStyle = '#3c8040';
            ctx.beginPath();
            ctx.ellipse(0, -20, 7, 11, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fdd0a0';
            ctx.beginPath();
            ctx.arc(0, -26, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillRect(-2, -28, 2, 3);
            ctx.fillRect(1, -28, 2, 3);
            ctx.fillStyle = '#cc4422';
            ctx.beginPath();
            ctx.ellipse(0, -31, 7, 5, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            
            // gyro effect indicator
            if (gyroEnabled && Math.abs(leanTarget)>0.1) {
                ctx.font = "bold 16px monospace";
                ctx.fillStyle = "#FFF9c4";
                ctx.shadowBlur = 3;
                ctx.fillText(leanTarget>0 ? "➡️" : "⬅️", screenX-20, bodyY-35);
            }
        }
        
        function drawUI() {
            if (bike.crashed) {
                ctx.font = "bold 28px system-ui";
                ctx.fillStyle = "#FFD966";
                ctx.shadowBlur = 6;
                ctx.fillText("💥 CRASHED", W/2-95, 70);
                ctx.font = "bold 14px monospace";
                ctx.fillStyle = "white";
                ctx.fillText("Press 🔄 to restart", W/2-85, 115);
            }
            // fuel bar
            let fuelWidth = (bike.fuel / 100) * 100;
            ctx.fillStyle = "#2c2b23";
            ctx.fillRect(15, 18, 104, 14);
            ctx.fillStyle = "#f5a623";
            ctx.fillRect(16, 19, fuelWidth, 12);
            ctx.fillStyle = "white";
            ctx.font = "bold 12px monospace";
            ctx.fillText("FUEL", 18, 16);
        }
        
        function drawBackground() {
            let grad = ctx.createLinearGradient(0,0,0,H);
            grad.addColorStop(0,"#85c1e0");
            grad.addColorStop(0.6,"#bbddbb");
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,W,H);
            // clouds
            ctx.fillStyle = "#fefefedd";
            for(let i=0;i<4;i++){
                let cx = (cameraX*0.2 + i*170) % (W+200) -80;
                ctx.beginPath();
                ctx.ellipse(cx, 45, 32, 26, 0, 0, Math.PI*2);
                ctx.ellipse(cx+28, 38, 28, 24, 0, 0, Math.PI*2);
                ctx.fill();
            }
        }
        
        function render() {
            drawBackground();
            drawTerrain();
            drawBike();
            drawUI();
        }
        
        // ----- RESET -----
        function resetGame() {
            terrain = generateTerrain();
            bike = {
                x: 280,
                y: getGroundY(280)-14,
                vx: 2.2,
                vy: 0,
                angle: 0,
                angVel: 0,
                rearY: 0, frontY: 0,
                fuel: 100,
                crashed: false,
                distance: 0,
                maxDistance: 0
            };
            gasOn = false;
            brakeOn = false;
            cameraX = 0;
            leanTarget = 0;
            gyroGamma = 0;
            document.getElementById('fuelVal').innerHTML = "100";
        }
        
        // ----- GYRO SETUP ------
        function initGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.body.addEventListener('touchstart', requestPermission);
                document.body.addEventListener('click', requestPermission);
                document.getElementById('gyroLabel').innerText = "Tap to enable gyro";
            } else {
                window.addEventListener('deviceorientation', (e) => { if(e.gamma) gyroGamma = e.gamma; });
                gyroEnabled = true;
                document.getElementById('gyroLabel').innerText = "🎯 Gyro ON";
            }
        }
        
        function requestPermission() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(perm => {
                        if (perm === 'granted') {
                            window.addEventListener('deviceorientation', (e) => { if(e.gamma) gyroGamma = e.gamma; });
                            gyroEnabled = true;
                            document.getElementById('gyroLabel').innerText = "📳 Tilt steer active";
                        }
                    }).catch(()=>{});
            }
            document.body.removeEventListener('touchstart', requestPermission);
        }
        
        // BUTTONS
        document.getElementById('gasBtn').addEventListener('mousedown', (e) => { e.preventDefault(); gasOn = true; });
        document.getElementById('gasBtn').addEventListener('mouseup', () => gasOn = false);
        document.getElementById('gasBtn').addEventListener('mouseleave', () => gasOn = false);
        document.getElementById('gasBtn').addEventListener('touchstart', (e) => { e.preventDefault(); gasOn = true; });
        document.getElementById('gasBtn').addEventListener('touchend', () => gasOn = false);
        
        document.getElementById('brakeBtn').addEventListener('mousedown', (e) => { e.preventDefault(); brakeOn = true; });
        document.getElementById('brakeBtn').addEventListener('mouseup', () => brakeOn = false);
        document.getElementById('brakeBtn').addEventListener('touchstart', (e) => { e.preventDefault(); brakeOn = true; });
        document.getElementById('brakeBtn').addEventListener('touchend', () => brakeOn = false);
        
        document.getElementById('resetBtn').addEventListener('click', () => resetGame());
        document.getElementById('resetBtn').addEventListener('touchstart', (e) => { e.preventDefault(); resetGame(); });
        
        // ANIMATION LOOP
        terrain = generateTerrain();
        bike.y = getGroundY(bike.x)-14;
        let lastTime = performance.now();
        function loop(now) {
            let dt = Math.min(0.033, (now - lastTime)/1000);
            if (dt > 0.005) {
                updatePhysics(dt);
                render();
            }
            lastTime = now;
            requestAnimationFrame(loop);
        }
        initGyro();
        loop(performance.now());
    })();
</script>
</body>
</html>
