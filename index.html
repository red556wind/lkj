<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hill Climb</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; touch-action:none; }
canvas { display:block; }
#hud {
  position:fixed; top:10px; left:10px;
  color:#fff; font:bold 18px monospace;
  text-shadow:1px 1px 3px #000;
  pointer-events:none;
}
#gas, #brk {
  position:fixed; bottom:30px;
  width:120px; height:120px;
  border-radius:50%;
  font:bold 20px monospace;
  color:#fff;
  border:none;
  cursor:pointer;
  touch-action:manipulation;
}
#gas { right:30px; background:rgba(200,80,0,0.85); }
#brk { left:30px; background:rgba(0,80,200,0.85); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="dist">0</span>m &nbsp; <span id="spd">0</span>km/h &nbsp; <span id="gyrotag" style="color:#aef">📳 tap=gyro</span></div>
<button id="brk">BRAKE</button>
<button id="gas">GAS</button>

<script>
var c = document.getElementById('c');
var ctx = c.getContext('2d');
var W, H;

function resize() {
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// terrain
var SEG = 15;
var TLEN = 6000;
var pts = [];

function makeTerrain() {
  pts = [];
  for (var i = 0; i <= TLEN; i += SEG) {
    var y = H - 120;
    y += Math.sin(i * 0.007) * 40;
    y += Math.sin(i * 0.019) * 25;
    y += Math.sin(i * 0.041) * 12;
    if (i > 800)  y += Math.sin((i-800)  * 0.015) * 35;
    if (i > 2000) y += Math.sin((i-2000) * 0.011) * 45;
    if (i > 3500) y += Math.sin((i-3500) * 0.008) * 55;
    if (y < H - 220) y = H - 220;
    if (y > H - 60)  y = H - 60;
    pts.push({x: i, y: y});
  }
  // smooth
  for (var s = 0; s < 3; s++) {
    for (var j = 1; j < pts.length - 1; j++) {
      pts[j].y = (pts[j-1].y + pts[j].y + pts[j+1].y) / 3;
    }
  }
}

function ty(wx) {
  if (wx <= 0) return pts[0].y;
  if (wx >= TLEN) return pts[pts.length-1].y;
  var i = Math.floor(wx / SEG);
  if (i >= pts.length - 1) i = pts.length - 2;
  var t = (wx - pts[i].x) / SEG;
  return pts[i].y * (1-t) + pts[i+1].y * t;
}

function tangle(wx) {
  return Math.atan2(ty(wx+5) - ty(wx-5), 10);
}

// bike state
var bx, by, vx, angle, angvel;

function resetBike() {
  bx = 300;
  by = ty(300) - 20;
  vx = 1;
  angle = 0;
  angvel = 0;
}

var camx = 0;
var gasOn = false;
var brkOn = false;

// gyro
var gyroGamma = 0;
var gyroActive = false;

function enableGyro() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(function(r) {
      if (r === 'granted') {
        window.addEventListener('deviceorientation', onGyro);
        gyroActive = true;
        document.getElementById('gyrotag').textContent = '🎮 gyro on';
      }
    }).catch(function(){});
  } else {
    window.addEventListener('deviceorientation', onGyro);
    gyroActive = true;
    document.getElementById('gyrotag').textContent = '🎮 gyro on';
  }
}

function onGyro(e) {
  if (e.gamma != null) gyroGamma = Math.max(-45, Math.min(45, e.gamma));
}

// buttons
var gasEl = document.getElementById('gas');
var brkEl = document.getElementById('brk');

gasEl.addEventListener('touchstart', function(e){ e.preventDefault(); gasOn=true; enableGyro(); });
gasEl.addEventListener('touchend',   function(e){ e.preventDefault(); gasOn=false; });
gasEl.addEventListener('mousedown',  function(){ gasOn=true; });
gasEl.addEventListener('mouseup',    function(){ gasOn=false; });

brkEl.addEventListener('touchstart', function(e){ e.preventDefault(); brkOn=true; });
brkEl.addEventListener('touchend',   function(e){ e.preventDefault(); brkOn=false; });
brkEl.addEventListener('mousedown',  function(){ brkOn=true; });
brkEl.addEventListener('mouseup',    function(){ brkOn=false; });

c.addEventListener('click', enableGyro);

// physics
function update(dt) {
  if (dt > 0.05) dt = 0.05;

  var acc = 0;
  if (gasOn) acc =  1.4;
  if (brkOn) acc = -1.2;

  var sl = tangle(bx);
  acc -= Math.sin(sl) * 0.5;

  vx += acc * dt;
  vx *= Math.pow(0.99, dt * 60);
  if (vx >  80) vx =  80;
  if (vx < -20) vx = -20;

  bx += vx * dt * 90;
  if (bx < 50)        { bx = 50;        if (vx < 0) vx = 0; }
  if (bx > TLEN - 50) { bx = TLEN - 50; if (vx > 0) vx = 0; }

  var rg = ty(bx - 14);
  var fg = ty(bx + 14);
  var ty_ = (rg + fg) / 2 - 12;
  by += (ty_ - by) * 0.2;

  var ta = Math.atan2(fg - rg, 28);

  if (gyroActive) {
    var lean = gyroGamma / 45;
    angvel += lean * 2.5 * (Math.abs(vx) * 0.08 + 0.4) * dt * 5;
  }

  angvel *= 0.92;
  angvel += (ta - angle) * 3 * dt;
  angle  += angvel * dt * 3;
  if (angle >  0.9) angle =  0.9;
  if (angle < -0.9) angle = -0.9;

  var tc = bx - W/2 + 50;
  if (tc < 0) tc = 0;
  if (tc > TLEN - W) tc = TLEN - W;
  camx += (tc - camx) * 0.08;

  document.getElementById('dist').textContent = Math.floor(bx / 5);
  document.getElementById('spd').textContent  = Math.floor(Math.abs(vx) * 2.5);
}

function drawTerrain() {
  var si = Math.max(0, Math.floor(camx / SEG) - 1);
  var ei = Math.min(pts.length - 1, si + Math.ceil(W / SEG) + 3);

  // dirt fill
  ctx.fillStyle = '#6b4226';
  ctx.beginPath();
  ctx.moveTo(pts[si].x - camx, pts[si].y);
  for (var i = si+1; i <= ei; i++) {
    ctx.lineTo(pts[i].x - camx, pts[i].y);
  }
  ctx.lineTo(pts[ei].x - camx, H);
  ctx.lineTo(pts[si].x - camx, H);
  ctx.fill();

  // grass top
  ctx.strokeStyle = '#4a8c2a';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(pts[si].x - camx, pts[si].y);
  for (var i = si+1; i <= ei; i++) {
    ctx.lineTo(pts[i].x - camx, pts[i].y);
  }
  ctx.stroke();
}

function drawBike() {
  var sx = bx - camx;
  var sy = by;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(angle);

  // exhaust pipe
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-8, 4);
  ctx.lineTo(-22, 6);
  ctx.lineTo(-26, 12);
  ctx.stroke();

  // exhaust smoke when gassing
  if (gasOn) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#ccc';
    ctx.beginPath(); ctx.arc(-30, 13, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-36, 11, 5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // swingarm
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-4, 6);
  ctx.lineTo(-18, 8);
  ctx.stroke();

  // front fork
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(8, -8);
  ctx.lineTo(18, 8);
  ctx.stroke();

  // rear wheel
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(-18, 8, 14, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(-18, 8, 14, 0, Math.PI*2); ctx.fill();
  // tread marks
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  for (var t = 0; t < 6; t++) {
    var ta = (t / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(-18, 8, 14, ta, ta + 0.3);
    ctx.stroke();
  }
  // hub
  ctx.fillStyle = '#bbb';
  ctx.beginPath(); ctx.arc(-18, 8, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#666';
  ctx.beginPath(); ctx.arc(-18, 8, 2, 0, Math.PI*2); ctx.fill();

  // front wheel
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(18, 8, 13, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(18, 8, 13, 0, Math.PI*2); ctx.fill();
  for (var t = 0; t < 6; t++) {
    var ta = (t / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.arc(18, 8, 13, ta, ta + 0.3);
    ctx.stroke();
  }
  ctx.fillStyle = '#bbb';
  ctx.beginPath(); ctx.arc(18, 8, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#666';
  ctx.beginPath(); ctx.arc(18, 8, 2, 0, Math.PI*2); ctx.fill();

  // main frame tube
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-18, 6);
  ctx.lineTo(-4, -10);
  ctx.lineTo(10, -10);
  ctx.lineTo(18, 4);
  ctx.stroke();

  // engine block
  ctx.fillStyle = '#222';
  ctx.fillRect(-10, -4, 18, 12);
  ctx.fillStyle = '#444';
  ctx.fillRect(-8, -2, 14, 8);
  // fins
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  for (var f = 0; f < 4; f++) {
    ctx.beginPath();
    ctx.moveTo(-8, -1 + f*2.5);
    ctx.lineTo(6,  -1 + f*2.5);
    ctx.stroke();
  }

  // tank & fairing
  ctx.fillStyle = '#e8251a';
  ctx.beginPath();
  ctx.moveTo(-6, -10);
  ctx.lineTo(-2, -22);
  ctx.lineTo(8, -22);
  ctx.lineTo(12, -10);
  ctx.fill();
  // tank highlight stripe
  ctx.fillStyle = '#ff5533';
  ctx.fillRect(0, -21, 4, 10);

  // seat
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(-8, -10);
  ctx.lineTo(-2, -14);
  ctx.lineTo(4, -14);
  ctx.lineTo(2, -10);
  ctx.fill();

  // front fairing / headlight
  ctx.fillStyle = '#cc1a10';
  ctx.beginPath();
  ctx.moveTo(10, -10);
  ctx.lineTo(22, -4);
  ctx.lineTo(20, 4);
  ctx.lineTo(12, 0);
  ctx.fill();
  // headlight
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.ellipse(20, 0, 4, 3, -0.3, 0, Math.PI*2);
  ctx.fill();

  // rider — crouched aggressive tuck
  // legs
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.moveTo(-2, -10);
  ctx.lineTo(-10, -4);
  ctx.lineTo(-8, 2);
  ctx.lineTo(0, -6);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(4, -10);
  ctx.lineTo(10, -4);
  ctx.lineTo(8, 2);
  ctx.lineTo(2, -6);
  ctx.fill();

  // body leaned forward
  ctx.fillStyle = '#ff3311';
  ctx.beginPath();
  ctx.ellipse(4, -20, 6, 10, 0.4, 0, Math.PI*2);
  ctx.fill();

  // arms reaching forward to bars
  ctx.strokeStyle = '#ff3311';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(4, -22);
  ctx.quadraticCurveTo(14, -18, 20, -8);
  ctx.stroke();

  // helmet — full face aggressive
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(6, -30, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#e8251a';
  ctx.beginPath();
  ctx.arc(6, -30, 8, Math.PI, 0);
  ctx.fill();
  // visor
  ctx.fillStyle = '#88ccff';
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.ellipse(9, -28, 5, 3, 0.3, 0, Math.PI);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();

  // gyro lean indicator
  if (gyroActive && Math.abs(gyroGamma) > 5) {
    ctx.save();
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.8;
    ctx.fillText(gyroGamma > 0 ? '▶' : '◀', sx + (gyroGamma > 0 ? 38 : -52), sy - 38);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function drawBg() {
  // sky
  ctx.fillStyle = '#4a9fd4';
  ctx.fillRect(0, 0, W, H);

  // simple clouds
  ctx.fillStyle = '#ffffff';
  var offsets = [0, 250, 500];
  for (var i = 0; i < offsets.length; i++) {
    var cx = ((camx * 0.15 + offsets[i] * 1.3) % (W + 200)) - 100;
    ctx.beginPath();
    ctx.arc(cx,      55, 28, 0, Math.PI*2);
    ctx.arc(cx + 35, 48, 24, 0, Math.PI*2);
    ctx.arc(cx - 28, 50, 22, 0, Math.PI*2);
    ctx.fill();
  }
}

var last = 0;
function loop(ts) {
  var dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0 && dt < 0.2) update(dt);
  ctx.clearRect(0, 0, W, H);
  drawBg();
  drawTerrain();
  drawBike();
  requestAnimationFrame(loop);
}

makeTerrain();
resetBike();
requestAnimationFrame(function(ts){ last = ts; loop(ts); });
</script>
</body>
</html>
